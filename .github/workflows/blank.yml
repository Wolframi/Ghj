name: Test PS1 Animation

on:
  workflow_dispatch:

jobs:
  record-script:
    runs-on: windows-latest

    steps:
      - name: Скачиваем файлы репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем FFmpeg для записи экрана
        run: choco install ffmpeg -y

      - name: Запускаем скрипт и записываем видео экрана (15 сек)
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Start-Process powershell.exe -ArgumentList '-ExecutionPolicy Bypass -File ".\More poverh vseh okon.ps1"'
          Start-Sleep -Seconds 2
          ffmpeg -y -f gdigrab -framerate 30 -i desktop -t 15 -c:v libx264 -pix_fmt yuv420p result.mp4

      - name: Сохраняем готовое видео для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: animation-video
          path: result.mp4
