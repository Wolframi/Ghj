name: Test PS1 Animation

on:
  workflow_dispatch:

jobs:
  record-script:
    runs-on: windows-latest

    steps:
      - name: Скачиваем файлы репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем FFmpeg для записи экрана
        run: choco install ffmpeg -y

      - name: Запускаем скрипт (STA) и записываем видео
        shell: powershell
        run: |
          $scriptPath = (Resolve-Path ".\More poverh vseh okon.ps1").Path
          
          # Читаем скрипт и пересохраняем в UTF-8 с BOM, чтобы не было ошибок кодировки
          $content = Get-Content -Path $scriptPath -Raw -Encoding UTF8
          [System.IO.File]::WriteAllText("$PWD\run.ps1", $content, [System.Text.UTF8Encoding]::new($true))

          # Запускаем в режиме -STA (обязательно для графики и анимации!) и пишем ошибки в log.txt
          Start-Process powershell.exe -ArgumentList "-STA -NoProfile -ExecutionPolicy Bypass -File `"$PWD\run.ps1`"" -RedirectStandardError "$PWD\error.txt"
          
          Start-Sleep -Seconds 3
          ffmpeg -y -f gdigrab -framerate 30 -i desktop -t 15 -c:v libx264 -pix_fmt yuv420p result.mp4

      - name: Сохраняем видео и лог ошибок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-video
          path: |
            result.mp4
            error.txt
