name: Test PS1 Animation

on:
  workflow_dispatch:

jobs:
  record-script:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - run: choco install ffmpeg -y

      - shell: powershell
        run: |
          $file = Get-ChildItem -Filter "*.ps1" | Select-Object -First 1
          if (-not $file) { throw "PS1 file not found" }
          $content = Get-Content -Path $file.FullName -Raw -Encoding UTF8
          [System.IO.File]::WriteAllText("$PWD\run.ps1", $content, [System.Text.UTF8Encoding]::new($true))
          Start-Process powershell.exe -ArgumentList "-STA", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$PWD\run.ps1" -RedirectStandardError "$PWD\error.txt"
          Start-Sleep -Seconds 3
          ffmpeg -y -f gdigrab -framerate 30 -i desktop -t 15 -c:v libx264 -pix_fmt yuv420p result.mp4

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-video
          path: |
            result.mp4
            error.txt
